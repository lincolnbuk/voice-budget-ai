spring.application.name=orcamento-ia-voz

spring.datasource.url=jdbc:h2:mem:orcamento-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Use a real secret in production. The development default is intentionally local-only.
app.security.api-key=${APP_API_KEY:local-dev-key}
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-openai-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.error.include-message=never

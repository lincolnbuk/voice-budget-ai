spring.application.name=voice-budget-ai

# Docker Compose and Render provide these values through environment variables.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/orcamento}
spring.datasource.username=${DB_USERNAME:orcamento}
spring.datasource.password=${DB_PASSWORD:orcamento}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Use a unique random secret of at least 32 bytes for each deployed environment.
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-at-least-32-chars}
app.jwt.issuer=${JWT_ISSUER:voice-budget-ai}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

spring.ai.openai.api-key=${OPENAI_API_KEY:missing-openai-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.port=${PORT:8080}
server.error.include-message=never

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orcamento
      POSTGRES_USER: orcamento
      POSTGRES_PASSWORD: orcamento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orcamento -d orcamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/orcamento
      DB_USERNAME: orcamento
      DB_PASSWORD: orcamento
      JWT_SECRET: local-docker-secret-change-before-deploy-123456
      OPENAI_API_KEY: ${OPENAI_API_KEY:-missing-openai-key}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
